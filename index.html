<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Pagina publica solo para que el TV la alcance: que no aparezca en buscadores. -->
<meta name="robots" content="noindex, nofollow">
<title>M.A.T.E.</title>
<link rel="stylesheet" href="mate.css">
</head>
<body>
<div id="lienzo">

  <!-- ====== inicio ====== -->
  <div id="inicio" class="abs papel-crema">
    <div id="disco" class="abs"></div>
    <div id="piso" class="abs"></div>
    <svg id="destellos" class="abs" width="112" height="100" viewBox="0 0 112 100">
      <path d="M40 6 L50 34 L78 44 L50 54 L40 82 L30 54 L2 44 L30 34 Z" fill="#35E0F2" stroke="#1B1437" stroke-width="4" stroke-linejoin="round"/>
      <path d="M92 52 L97 66 L111 71 L97 76 L92 90 L87 76 L73 71 L87 66 Z" fill="#FF9A4D" stroke="#1B1437" stroke-width="3.5" stroke-linejoin="round"/>
    </svg>
    <div id="mate-caja" class="abs"><img id="mate" alt="M.A.T.E."></div>

    <div id="reloj" class="abs"></div>
    <div id="fecha" class="abs"></div>

    <div id="botones" class="abs">
      <div id="b-entradas" class="boton">
        <span class="chip" style="background:#FF9A4D">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1B1437" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5H6.5A2.5 2.5 0 0 0 4 7.5v9A2.5 2.5 0 0 0 6.5 19H10"/><path d="M11 12h9"/><path d="M16 7.5l4.5 4.5-4.5 4.5"/></svg>
        </span>Entradas
      </div>
      <div id="b-red" class="boton">
        <span id="chip-red" class="chip" style="background:#35E0F2">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1B1437" stroke-width="2.8" stroke-linecap="round"><path d="M3 9.5a13 13 0 0 1 18 0"/><path d="M6.5 13.5a8 8 0 0 1 11 0"/><circle cx="12" cy="18" r="1.9" fill="#1B1437" stroke="none"/></svg>
        </span><span id="txt-red">Red</span>
      </div>
      <div id="b-ajustes" class="boton">
        <span class="chip" style="background:#B9A7FF">
          <svg viewBox="0 0 24 24"><path d="M10.11 4.95 L10.58 1.90 L13.42 1.90 L13.89 4.95 L15.65 5.68 L18.14 3.85 L20.15 5.86 L18.32 8.35 L19.05 10.11 L22.10 10.58 L22.10 13.42 L19.05 13.89 L18.32 15.65 L20.15 18.14 L18.14 20.15 L15.65 18.32 L13.89 19.05 L13.42 22.10 L10.58 22.10 L10.11 19.05 L8.35 18.32 L5.86 20.15 L3.85 18.14 L5.68 15.65 L4.95 13.89 L1.90 13.42 L1.90 10.58 L4.95 10.11 L5.68 8.35 L3.85 5.86 L5.86 3.85 L8.35 5.68Z" fill="#1B1437" stroke="#1B1437" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.4" fill="#B9A7FF"/></svg>
        </span>Ajustes
      </div>
    </div>

    <div id="globo" class="abs">
      <svg viewBox="0 0 632 116">
        <path transform="translate(8,8)" d="M44 0H588A44 44 0 0 1 632 44V72A44 44 0 0 1 588 116H80Q26 126 -36 132Q8 100 2 58V44A44 44 0 0 1 44 0Z" fill="#1B1437" stroke="#1B1437" stroke-width="5" stroke-linejoin="round"/>
        <path d="M44 0H588A44 44 0 0 1 632 44V72A44 44 0 0 1 588 116H80Q26 126 -36 132Q8 100 2 58V44A44 44 0 0 1 44 0Z" fill="#fff" stroke="#1B1437" stroke-width="5" stroke-linejoin="round"/>
      </svg>
      <div id="globo-txt"></div>
    </div>
    <div id="saludo" class="abs"></div>

    <div id="favs"></div>

    <div id="b-todas" class="abs boton">
      <span class="chip">
        <svg viewBox="0 0 24 24" fill="#1B1437" style="width:24px;height:24px"><rect x="3" y="3" width="7.6" height="7.6" rx="2.4"/><rect x="13.4" y="3" width="7.6" height="7.6" rx="2.4"/><rect x="3" y="13.4" width="7.6" height="7.6" rx="2.4"/><rect x="13.4" y="13.4" width="7.6" height="7.6" rx="2.4"/></svg>
      </span>Todas tus apps<svg class="flecha" viewBox="0 0 24 24" fill="none" stroke="#1B1437" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </div>
    <div id="ayuda-inicio" class="abs ayuda"><span class="tecla">OK</span>Abrir<span class="sep"></span><span class="tecla">Mantené OK</span>Mover</div>
    <div id="aviso" class="abs"></div>

    <div id="entradas" class="abs"></div>
    <div id="iris" class="abs"></div>
  </div>

  <!-- ====== todas tus apps ====== -->
  <div id="todas" class="abs papel-lila">
    <div id="plancha" class="abs"></div>
    <div id="franja-arriba" class="abs franja papel-lila"></div>
    <div id="franja-abajo" class="abs franja papel-lila"></div>
    <div id="t-titulo" class="abs">Todas tus apps</div>
    <div id="t-cuenta" class="abs"></div>
    <div id="t-leyenda" class="abs"><svg viewBox="0 0 32 32"><path d="M16 2.5l4 8.4 9.2 1.2-6.8 6.3 1.8 9.1L16 23l-8.2 4.5 1.8-9.1-6.8-6.3 9.2-1.2z" fill="#FF9A4D" stroke="#1B1437" stroke-width="3" stroke-linejoin="round"/></svg><span id="t-leyenda-txt">en tu inicio</span></div>
    <div id="t-reloj" class="abs"></div>
    <div id="t-disco" class="abs"></div>
    <img id="t-mate" class="abs" alt="M.A.T.E. con lupa">
    <div id="t-globo" class="abs"></div>
    <div id="ayuda-todas" class="abs ayuda" style="z-index:8"><span class="tecla">OK</span>Abrir<span class="sep"></span><span class="tecla">Mantené OK</span>Poner o sacar del inicio<span class="sep"></span><span class="tecla">Atrás</span>Volver</div>
  </div>

</div>
<script src="config.js"></script>
<script src="tele.js"></script>
<script src="mate.js"></script>
</body>
</html>
